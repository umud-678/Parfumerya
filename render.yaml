# API-ni Render.com-da deploy etmək üçün (Vercel API-ni dəstəkləmir)
# https://render.com → New → Blueprint → bu repo

services:
  - type: web
    name: parfumerya-3
    runtime: node
    rootDir: api
    branch: main
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: CORS_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # MongoDB Atlas connection string — Render dashboard-dan təyin edin
      - key: MONGODB_URI
        sync: false
      # Gmail OTP — Render dashboard-dan təyin edin (App Password lazımdır)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: OTP_SECRET
        sync: false
